<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#070a10">
<title>MeDDia</title>
<style>
:root{
  --bg:#070a10; --panel:#101624; --raise:#161e30;
  --line:rgba(150,180,255,.14); --line2:rgba(150,180,255,.28);
  --text:#e6ecf8; --muted:#7f8ba4;
  --sig:#5b9bff; --sig2:#6ff0e0; --ink:#04101f; --danger:#ff5c7a;
  --accent:var(--sig); --glass:rgba(14,20,33,.80);
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--sig);outline-offset:2px}

#app{min-height:100%;display:flex;flex-direction:column;padding-bottom:var(--bottom)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + var(--top)) 16px 12px;background:var(--glass);
  -webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);box-shadow:inset 0 -1px 0 rgba(91,155,255,.05)}
header h1{font-size:1.35rem;font-weight:800;margin:0;letter-spacing:.015em;line-height:1.1}
.dd{background:linear-gradient(100deg,var(--sig),var(--sig2));-webkit-background-clip:text;background-clip:text;
  color:transparent;animation:glow 1.8s .25s ease-out 1 both}
@keyframes glow{
  0%{filter:drop-shadow(0 0 0 rgba(111,240,224,0))}
  40%{filter:drop-shadow(0 0 10px rgba(111,240,224,.9))}
  100%{filter:drop-shadow(0 0 6px rgba(111,240,224,.32))}
}
.count{color:var(--muted);font-size:.8rem;margin-top:3px;letter-spacing:.01em}
.btn{background:var(--sig);color:var(--ink);border:0;border-radius:12px;padding:11px 18px;font-weight:650;
  box-shadow:0 6px 22px -8px rgba(91,155,255,.7),inset 0 1px 0 rgba(255,255,255,.28);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line2);box-shadow:none}
.btn.danger{background:var(--danger);color:#240812;box-shadow:0 6px 22px -8px rgba(255,92,122,.7),inset 0 1px 0 rgba(255,255,255,.25)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.035);border-radius:999px;padding:7px 15px;
  font-size:.85rem;white-space:nowrap;color:var(--muted);transition:color .15s,background .15s}
#chipsA .chip{font-size:.8rem;padding:5px 12px}
.chip.on{background:var(--sig);color:var(--ink);border-color:transparent;font-weight:650;
  box-shadow:0 4px 18px -4px rgba(91,155,255,.65)}

#banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
#btitle{flex:1;font-weight:700;font-size:1.05rem}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:2px;padding:2px;flex:1;align-content:start}
.dh{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:20px 10px 8px;font-size:.82rem;font-weight:600;color:var(--text);letter-spacing:.01em}
.dh::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
