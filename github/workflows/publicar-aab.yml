name: Gerar AAB do MeDDia

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar pasta www
        run: mkdir -p www && cp -n index.html www/ || true
      - name: Instalar dependências
        run: npm install
      - name: Criar projeto Android
        run: npx cap add android
      - name: Sincronizar
        run: npx cap sync android
      - name: Ajustar targetSdk, versão e assinatura
        run: |
          sed -i 's/targetSdkVersion = 34/targetSdkVersion = 35/' android/variables.gradle
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/" android/app/build.gradle
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle
          cat > android/app/signing.gradle <<'EOF'
          android {
            signingConfigs {
              release {
                storeFile file(System.getenv("KEYSTORE_PATH"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.release
              }
            }
          }
          EOF
      - name: Decodificar chave
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Gerar AAB assinado
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: meddia-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
