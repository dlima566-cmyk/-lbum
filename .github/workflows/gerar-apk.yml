name: Gerar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar www
        run: mkdir -p www && cp -n index.html www/ || true
      - name: Instalar dependencias
        run: npm install
      - name: Ativar modo galeria e nome do app
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.appName='MeDDia';c.plugins=Object.assign({},c.plugins,{Media:{androidGalleryMode:true}});fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - name: Criar projeto Android
        run: npx cap add android
      - name: Icones
        run: unzip -o icons.zip -d android/app/src/main/res
      - name: Nome do app
        run: |
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">MeDDia</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">MeDDia</string>#' android/app/src/main/res/values/strings.xml
      - name: Permissoes de galeria
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" /><uses-permission android:name="android.permission.READ_MEDIA_VIDEO" /><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" /><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" /><uses-permission android:name="android.permission.USE_BIOMETRIC" /><application#' android/app/src/main/AndroidManifest.xml
      - name: Exclusao nativa
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR"
          cat > "$DIR/MediaDeletePlugin.java" <<'JAVA'
          package __PKG__;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          import java.util.ArrayList;
          import java.util.List;

          @CapacitorPlugin(name = "MediaDelete", requestCodes = {9301})
          public class MediaDeletePlugin extends Plugin {
              private static final int REQ = 9301;

              private Uri findUri(String path) {
                  Uri[] cols = new Uri[] {
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  };
                  for (Uri col : cols) {
                      Cursor c = null;
                      try {
                          c = getContext().getContentResolver().query(
                              col,
                              new String[] { MediaStore.MediaColumns._ID },
                              MediaStore.MediaColumns.DATA + "=?",
                              new String[] { path },
                              null
                          );
                          if (c != null && c.moveToFirst()) {
                              return ContentUris.withAppendedId(col, c.getLong(0));
                          }
                      } catch (Exception e) {
                          // tenta a proxima colecao
                      } finally {
                          if (c != null) c.close();
                      }
                  }
                  return null;
              }

              @PluginMethod
              public void deleteFiles(PluginCall call) {
                  JSArray arr = call.getArray("paths");
                  if (arr == null) {
                      call.reject("sem caminhos");
                      return;
                  }
                  List<Uri> uris = new ArrayList<>();
                  try {
                      List<String> paths = arr.toList();
                      for (String p : paths) {
                          Uri u = findUri(p);
                          if (u != null) uris.add(u);
                      }
                  } catch (Exception e) {
                      call.reject("erro ao ler caminhos: " + e.getMessage());
                      return;
                  }
                  if (uris.isEmpty()) {
                      call.reject("arquivo nao encontrado na galeria do Android");
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          PendingIntent pi = MediaStore.createDeleteRequest(getContext().getContentResolver(), uris);
                          saveCall(call);
                          getActivity().startIntentSenderForResult(pi.getIntentSender(), REQ, null, 0, 0, 0);
                      } catch (Exception e) {
                          call.reject("erro: " + e.getMessage());
                      }
                  } else {
                      int n = 0;
                      for (Uri u : uris) {
                          try {
                              n += getContext().getContentResolver().delete(u, null, null);
                          } catch (Exception e) {
                              // ignora e segue
                          }
                      }
                      JSObject r = new JSObject();
                      r.put("deleted", n);
                      call.resolve(r);
                  }
              }

              @Override
              protected void handleOnActivityResult(int requestCode, int resultCode, Intent data) {
                  super.handleOnActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ) return;
                  PluginCall call = getSavedCall();
                  if (call == null) return;
                  if (resultCode == Activity.RESULT_OK) {
                      JSObject r = new JSObject();
                      r.put("deleted", true);
                      call.resolve(r);
                  } else {
                      call.reject("cancelado");
                  }
              }
          }
          JAVA
          cat > "$DIR/VaultPlugin.java" <<'JAVA'
          package __PKG__;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.media.MediaScannerConnection;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.webkit.MimeTypeMap;

          import androidx.biometric.BiometricManager;
          import androidx.biometric.BiometricPrompt;
          import androidx.core.content.ContextCompat;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.FileOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.UUID;

          @CapacitorPlugin(name = "Vault")
          public class VaultPlugin extends Plugin {
              private static final int AUTH = BiometricManager.Authenticators.BIOMETRIC_STRONG | BiometricManager.Authenticators.BIOMETRIC_WEAK;

              private File dir() {
                  File d = new File(getContext().getFilesDir(), "vault");
                  if (!d.exists()) d.mkdirs();
                  return d;
              }

              private synchronized JSONArray readIdx() {
                  try {
                      File f = new File(dir(), "index.json");
                      if (!f.exists()) return new JSONArray();
                      InputStream in = new FileInputStream(f);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] b = new byte[8192];
                      int n;
                      while ((n = in.read(b)) > 0) bo.write(b, 0, n);
                      in.close();
                      return new JSONArray(bo.toString("UTF-8"));
                  } catch (Exception e) {
                      return new JSONArray();
                  }
              }

              private synchronized void writeIdx(JSONArray a) throws Exception {
                  File tmp = new File(dir(), "index.tmp");
                  OutputStream o = new FileOutputStream(tmp);
                  o.write(a.toString().getBytes("UTF-8"));
                  o.close();
                  tmp.renameTo(new File(dir(), "index.json"));
              }

              private void copy(InputStream in, OutputStream out) throws Exception {
                  byte[] b = new byte[65536];
                  int n;
                  while ((n = in.read(b)) > 0) out.write(b, 0, n);
                  in.close();
                  out.close();
              }

              private String ext(String name) {
                  int i = name.lastIndexOf('.');
                  return i >= 0 ? name.substring(i) : "";
              }

              private boolean ids(JSONArray idx, JSArray ids, boolean wipe) throws Exception {
                  JSONArray keep = new JSONArray();
                  for (int i = 0; i < idx.length(); i++) {
                      JSONObject o = idx.getJSONObject(i);
                      boolean hit = false;
                      for (int j = 0; j < ids.length(); j++) if (o.getString("id").equals(ids.getString(j))) hit = true;
                      if (hit) { if (wipe) new File(dir(), o.getString("file")).delete(); }
                      else keep.put(o);
                  }
                  writeIdx(keep);
                  return true;
              }

              @PluginMethod
              public void available(PluginCall call) {
                  JSObject r = new JSObject();
                  r.put("ok", BiometricManager.from(getContext()).canAuthenticate(AUTH) == BiometricManager.BIOMETRIC_SUCCESS);
                  call.resolve(r);
              }

              @PluginMethod
              public void authenticate(final PluginCall call) {
                  final String title = call.getString("title", "Pasta bloqueada");
                  getActivity().runOnUiThread(new Runnable() {
                      public void run() {
                          try {
                              BiometricPrompt.PromptInfo info = new BiometricPrompt.PromptInfo.Builder()
                                  .setTitle(title).setSubtitle("Use sua digital")
                                  .setNegativeButtonText("Usar senha").setAllowedAuthenticators(AUTH).build();
                              BiometricPrompt bp = new BiometricPrompt(getActivity(), ContextCompat.getMainExecutor(getContext()),
                                  new BiometricPrompt.AuthenticationCallback() {
                                      @Override public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) { call.resolve(); }
                                      @Override public void onAuthenticationError(int code, CharSequence msg) {
                                          if (code == BiometricPrompt.ERROR_USER_CANCELED || code == BiometricPrompt.ERROR_CANCELED) call.reject("cancelado");
                                          else call.reject("senha");
                                      }
                                  });
                              bp.authenticate(info);
                          } catch (Exception e) {
                              call.reject("senha");
                          }
                      }
                  });
              }

              @PluginMethod
              public void moveIn(final PluginCall call) {
                  final JSArray items = call.getArray("items");
                  if (items == null) { call.reject("sem itens"); return; }
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              JSONArray idx = readIdx();
                              JSArray done = new JSArray();
                              for (int i = 0; i < items.length(); i++) {
                                  try {
                                      JSONObject o = items.getJSONObject(i);
                                      File src = new File(o.getString("path"));
                                      String id = UUID.randomUUID().toString();
                                      String name = o.optString("name", src.getName());
                                      String fn = id + ext(name);
                                      File dst = new File(dir(), fn);
                                      copy(new FileInputStream(src), new FileOutputStream(dst));
                                      if (dst.length() != src.length()) { dst.delete(); continue; }
                                      JSONObject e = new JSONObject();
                                      e.put("id", id); e.put("file", fn); e.put("name", name);
                                      e.put("t", o.optLong("t", 0)); e.put("album", o.optString("album", ""));
                                      e.put("video", o.optInt("video", 0));
                                      idx.put(e); done.put(id);
                                  } catch (Exception ex) { /* pula este item */ }
                              }
                              if (done.length() == 0) { call.reject("nenhum arquivo copiado"); return; }
                              writeIdx(idx);
                              JSObject r = new JSObject();
                              r.put("ids", done);
                              call.resolve(r);
                          } catch (Exception e) {
                              call.reject("erro: " + e.getMessage());
                          }
                      }
                  }).start();
              }

              @PluginMethod
              public void list(PluginCall call) {
                  try {
                      JSONArray idx = readIdx();
                      JSArray out = new JSArray();
                      for (int i = 0; i < idx.length(); i++) {
                          JSONObject o = idx.getJSONObject(i);
                          File f = new File(dir(), o.getString("file"));
                          if (!f.exists()) continue;
                          JSObject x = new JSObject();
                          x.put("id", o.getString("id")); x.put("path", f.getAbsolutePath());
                          x.put("name", o.getString("name")); x.put("t", o.optLong("t", 0));
                          x.put("album", o.optString("album", "")); x.put("video", o.optInt("video", 0));
                          out.put(x);
                      }
                      JSObject r = new JSObject();
                      r.put("items", out);
                      call.resolve(r);
                  } catch (Exception e) {
                      call.reject("erro: " + e.getMessage());
                  }
              }

              @PluginMethod
              public void discard(PluginCall call) {
                  try { ids(readIdx(), call.getArray("ids"), true); call.resolve(); }
                  catch (Exception e) { call.reject("erro: " + e.getMessage()); }
              }

              @PluginMethod
              public void remove(PluginCall call) { discard(call); }

              @PluginMethod
              public void moveOut(final PluginCall call) {
                  final JSArray want = call.getArray("ids");
                  if (want == null) { call.reject("sem itens"); return; }
                  new Thread(new Runnable() {
                      public void run() {
                          try {
                              JSONArray idx = readIdx();
                              JSArray ok = new JSArray();
                              for (int i = 0; i < idx.length(); i++) {
                                  JSONObject o = idx.getJSONObject(i);
                                  boolean hit = false;
                                  for (int j = 0; j < want.length(); j++) if (o.getString("id").equals(want.getString(j))) hit = true;
                                  if (!hit) continue;
                                  try {
                                      File f = new File(dir(), o.getString("file"));
                                      String name = o.getString("name");
                                      boolean vid = o.optInt("video", 0) == 1;
                                      String mime = MimeTypeMap.getSingleton().getMimeTypeFromExtension(ext(name).replace(".", "").toLowerCase());
                                      if (mime == null) mime = vid ? "video/mp4" : "image/jpeg";
                                      String base = vid ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_PICTURES;
                                      if (Build.VERSION.SDK_INT >= 29) {
                                          ContentResolver cr = getContext().getContentResolver();
                                          ContentValues v = new ContentValues();
                                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                                          v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, base + "/MeDDia");
                                          long t = o.optLong("t", 0);
                                          if (t > 0) v.put(MediaStore.MediaColumns.DATE_TAKEN, t);
                                          Uri col = vid ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI : MediaStore.Images.Media.EXTERNAL_CONTENT_URI;
                                          Uri u = cr.insert(col, v);
                                          if (u == null) continue;
                                          copy(new FileInputStream(f), cr.openOutputStream(u));
                                      } else {
                                          File d = new File(Environment.getExternalStoragePublicDirectory(base), "MeDDia");
                                          d.mkdirs();
                                          File dst = new File(d, name);
                                          copy(new FileInputStream(f), new FileOutputStream(dst));
                                          MediaScannerConnection.scanFile(getContext(), new String[]{dst.getAbsolutePath()}, null, null);
                                      }
                                      ok.put(o.getString("id"));
                                  } catch (Exception ex) { /* mantém no cofre */ }
                              }
                              if (ok.length() == 0) { call.reject("nenhum arquivo restaurado"); return; }
                              ids(readIdx(), ok, true);
                              call.resolve();
                          } catch (Exception e) {
                              call.reject("erro: " + e.getMessage());
                          }
                      }
                  }).start();
              }
          }
          JAVA
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaDeletePlugin.class);
                  registerPlugin(VaultPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i "s/__PKG__/$APPID/" "$DIR/MediaDeletePlugin.java" "$DIR/VaultPlugin.java" "$DIR/MainActivity.java"
      - name: Dependencia de biometria
        run: sed -i '/^dependencies {/a\    implementation "androidx.biometric:biometric:1.1.0"' android/app/build.gradle
      - name: Sincronizar
        run: npx cap sync android
      - name: Assinatura fixa
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: visualizador-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
