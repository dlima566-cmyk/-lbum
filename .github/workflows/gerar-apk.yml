name: Gerar APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar www
        run: mkdir -p www && cp -n index.html www/ || true
      - name: Instalar dependencias
        run: npm install
      - name: Ativar modo galeria e nome do app
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));c.appName='MeDDia';c.plugins=Object.assign({},c.plugins,{Media:{androidGalleryMode:true}});fs.writeFileSync('capacitor.config.json',JSON.stringify(c,null,2))"
      - name: Criar projeto Android
        run: npx cap add android
      - name: Icones
        run: unzip -o icons.zip -d android/app/src/main/res
      - name: Nome do app
        run: |
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">MeDDia</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">MeDDia</string>#' android/app/src/main/res/values/strings.xml
      - name: Permissoes de galeria
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.READ_MEDIA_IMAGES" /><uses-permission android:name="android.permission.READ_MEDIA_VIDEO" /><uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" /><uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" /><application#' android/app/src/main/AndroidManifest.xml
      - name: Exclusao nativa
        run: |
          APPID=$(node -p "require('./capacitor.config.json').appId")
          DIR="android/app/src/main/java/$(echo "$APPID" | tr . /)"
          mkdir -p "$DIR"
          cat > "$DIR/MediaDeletePlugin.java" <<'JAVA'
          package __PKG__;

          import android.app.Activity;
          import android.app.PendingIntent;
          import android.content.ContentUris;
          import android.content.Intent;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;

          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.PluginMethod;

          import java.util.ArrayList;
          import java.util.List;

          @CapacitorPlugin(name = "MediaDelete", requestCodes = {9301})
          public class MediaDeletePlugin extends Plugin {
              private static final int REQ = 9301;

              private Uri findUri(String path) {
                  Uri[] cols = new Uri[] {
                      MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                  };
                  for (Uri col : cols) {
                      Cursor c = null;
                      try {
                          c = getContext().getContentResolver().query(
                              col,
                              new String[] { MediaStore.MediaColumns._ID },
                              MediaStore.MediaColumns.DATA + "=?",
                              new String[] { path },
                              null
                          );
                          if (c != null && c.moveToFirst()) {
                              return ContentUris.withAppendedId(col, c.getLong(0));
                          }
                      } catch (Exception e) {
                          // tenta a proxima colecao
                      } finally {
                          if (c != null) c.close();
                      }
                  }
                  return null;
              }

              @PluginMethod
              public void deleteFiles(PluginCall call) {
                  JSArray arr = call.getArray("paths");
                  if (arr == null) {
                      call.reject("sem caminhos");
                      return;
                  }
                  List<Uri> uris = new ArrayList<>();
                  try {
                      List<String> paths = arr.toList();
                      for (String p : paths) {
                          Uri u = findUri(p);
                          if (u != null) uris.add(u);
                      }
                  } catch (Exception e) {
                      call.reject("erro ao ler caminhos: " + e.getMessage());
                      return;
                  }
                  if (uris.isEmpty()) {
                      call.reject("arquivo nao encontrado na galeria do Android");
                      return;
                  }
                  if (Build.VERSION.SDK_INT >= 30) {
                      try {
                          PendingIntent pi = MediaStore.createDeleteRequest(getContext().getContentResolver(), uris);
                          saveCall(call);
                          getActivity().startIntentSenderForResult(pi.getIntentSender(), REQ, null, 0, 0, 0);
                      } catch (Exception e) {
                          call.reject("erro: " + e.getMessage());
                      }
                  } else {
                      int n = 0;
                      for (Uri u : uris) {
                          try {
                              n += getContext().getContentResolver().delete(u, null, null);
                          } catch (Exception e) {
                              // ignora e segue
                          }
                      }
                      JSObject r = new JSObject();
                      r.put("deleted", n);
                      call.resolve(r);
                  }
              }

              @Override
              protected void handleOnActivityResult(int requestCode, int resultCode, Intent data) {
                  super.handleOnActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ) return;
                  PluginCall call = getSavedCall();
                  if (call == null) return;
                  if (resultCode == Activity.RESULT_OK) {
                      JSObject r = new JSObject();
                      r.put("deleted", true);
                      call.resolve(r);
                  } else {
                      call.reject("cancelado");
                  }
              }
          }
          JAVA
          cat > "$DIR/MainActivity.java" <<'JAVA'
          package __PKG__;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaDeletePlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA
          sed -i "s/__PKG__/$APPID/" "$DIR/MediaDeletePlugin.java" "$DIR/MainActivity.java"
      - name: Sincronizar
        run: npx cap sync android
      - name: Assinatura fixa
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
      - name: Compilar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: visualizador-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
