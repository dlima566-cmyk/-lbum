<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#17181c">
<title>MeDDia</title>
<style>
:root{
  --bg:#17181c; --panel:#1f2127; --line:#2e3139; --text:#e9e7e2; --muted:#9a9ca3; --accent:#8fb8ff;
  --top:env(safe-area-inset-top,0px); --bottom:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{min-height:100%;display:flex;flex-direction:column;padding-top:var(--top);padding-bottom:var(--bottom)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:1.2rem;font-weight:700;margin:0;letter-spacing:.2px}
.dd{color:var(--accent)}
.count{color:var(--muted);font-size:.85rem}
.btn{background:var(--accent);color:#0e1626;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.actions{display:flex;gap:8px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 12px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:.85rem;white-space:nowrap}
.chip.on{background:var(--accent);color:#0e1626;border-color:var(--accent);font-weight:600}

#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:4px;padding:4px;flex:1;align-content:start}
.dh{grid-column:1/-1;padding:14px 6px 4px;font-size:.85rem;font-weight:600;color:var(--muted)}
.thumb{position:relative;aspect-ratio:1;padding:0;border:0;background:var(--panel);overflow:hidden;border-radius:4px}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.play{position:absolute;right:6px;bottom:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);display:grid;place-items:center;font-size:11px;pointer-events:none}
.hb{position:absolute;left:6px;top:4px;color:#ff6b81;font-size:16px;text-shadow:0 0 4px #000;pointer-events:none}
#none{margin:40px 16px;text-align:center;color:var(--muted)}
#empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px;text-align:center}
#empty p{margin:0;color:var(--muted);max-width:28ch}
#empty strong{display:block;color:var(--text);font-size:1.2rem;margin-bottom:6px}

#viewer{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:10}
#viewer.open{display:flex}
#stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage img{max-width:100%;max-height:100%;transform-origin:center;will-change:transform;pointer-events:none;-webkit-user-drag:none}
#stage video{max-width:100%;max-height:100%;display:none}
.bar{position:absolute;left:0;right:0;display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(15,16,19,.78);backdrop-filter:blur(8px);transition:opacity .2s}
.bar.top{top:0;padding-top:calc(10px + var(--top));justify-content:space-between}
.bar.bottom{bottom:0;padding-bottom:calc(10px + var(--bottom));justify-content:center;flex-wrap:wrap}
#viewer.hide-ui .bar{opacity:0;pointer-events:none}
#viewer.isvid .bar.bottom{display:none}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center}
.ib:active{background:rgba(255,255,255,.14)}
.ib[aria-pressed="true"]{background:rgba(143,184,255,.22);color:var(--accent)}
#fav[aria-pressed="true"]{background:transparent;color:#ff6b81}
#fav[aria-pressed="true"] svg{fill:currentColor}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#title{flex:1;min-width:0;text-align:center;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pos{color:var(--muted);font-size:.8rem;margin-left:6px}
.nav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(15,16,19,.6)}
.nav.prev{left:8px}.nav.next{right:8px}
#viewer.hide-ui .nav{opacity:0;pointer-events:none}
@media (hover:none){.nav{display:none}}
#viewer.isvid .nav{display:grid}
@media (prefers-reduced-motion:reduce){.bar{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Me<span class="dd">DD</span>ia</h1>
      <div class="count" id="count">Nenhuma imagem</div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="clear" hidden>Limpar</button>
      <button class="btn" id="add">Adicionar</button>
    </div>
  </header>
  <div id="chips" hidden>
    <div class="chips" id="chipsT"></div>
    <div class="chips" id="chipsA" hidden></div>
  </div>
  <div id="empty">
    <div><strong>Nenhuma foto ainda</strong><p>Escolha imagens do seu aparelho para vê-las aqui. Nada sai do seu dispositivo.</p></div>
    <button class="btn" id="add2">Escolher fotos</button>
  </div>
  <p id="none" hidden>Nada por aqui neste filtro.</p>
  <main id="grid" hidden></main>
</div>

<input type="file" id="file" accept="image/*,video/*" multiple hidden>

<section id="viewer" aria-label="Visualizador" aria-modal="true" role="dialog">
  <div id="stage"><img id="img" alt=""><video id="vid" controls playsinline></video></div>
  <div class="bar top">
    <button class="ib" id="close" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div id="title"></div><span id="pos"></span>
    <button class="ib" id="fav" aria-label="Favoritar" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9.1C1.1 8.7 2.9 5 6.4 5c2 0 3.600 1.200 5.600 3.400C14 6.200 15.600 5 17.600 5c3.500 0 5.300 3.700 3.700 6.900C19 16.400 12 21 12 21z"/></svg></button>
    <button class="ib" id="remove" aria-label="Remover da lista"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12h10l1-12M9 7V4h6v3"/></svg></button>
  </div>
  <button class="ib nav prev" id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button class="ib nav next" id="next" aria-label="Próximo"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <div class="bar bottom">
    <button class="ib" id="zout" aria-label="Diminuir zoom"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6"/></svg></button>
    <button class="ib" id="zin" aria-label="Aumentar zoom"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5M8 11h6M11 8v6"/></svg></button>
    <button class="ib" id="rotl" aria-label="Girar para a esquerda"><svg viewBox="0 0 24 24"><path d="M3 4v6h6M3.5 10A9 9 0 1 1 5 17"/></svg></button>
    <button class="ib" id="rotr" aria-label="Girar para a direita"><svg viewBox="0 0 24 24"><path d="M21 4v6h-6M20.5 10A9 9 0 1 0 19 17"/></svg></button>
    <button class="ib" id="reset" aria-label="Ajustar à tela"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" id="play" aria-label="Apresentação" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
  </div>
</section>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var all = [];             // tudo: {url, name, video, t, key, album}
  var items = [];           // o que está na tela (depois dos filtros)
  var cur = 0;
  var scale = 1, tx = 0, ty = 0, rot = 0;
  var timer = null;
  var fType = 'all', fAlbum = null;
  var favs = {};
  try { favs = JSON.parse(localStorage.getItem('galeria_fav_v1') || '{}') || {}; } catch (e) {}
  function saveFavs(){ try { localStorage.setItem('galeria_fav_v1', JSON.stringify(favs)); } catch (e) {} }

  var file = $('file'), grid = $('grid'), empty = $('empty'), viewer = $('viewer'),
      stage = $('stage'), img = $('img'), vid = $('vid'),
      chipsT = $('chipsT'), chipsA = $('chipsA');

  function pick(){ file.click(); }
  $('add').onclick = pick; $('add2').onclick = pick;

  file.onchange = function(){
    Array.prototype.forEach.call(file.files, function(f){
      var isV = f.type.indexOf('video/') === 0;
      if (isV || f.type.indexOf('image/') === 0) {
        var u = URL.createObjectURL(f);
        all.unshift({url: u, name: f.name, video: isV, t: f.lastModified || Date.now(), key: u, album: 'Adicionadas'});
      }
    });
    file.value = '';
    applyFilter();
  };

  $('clear').onclick = function(){
    all.forEach(function(i){ if (i.url.indexOf('blob:') === 0) URL.revokeObjectURL(i.url); });
    all = []; fType = 'all'; fAlbum = null; applyFilter();
  };

  /* ---- Filtros ---- */
  function chip(label, on, fn){
    var b = document.createElement('button');
    b.className = 'chip' + (on ? ' on' : ''); b.textContent = label; b.onclick = fn;
    return b;
  }
  function renderChips(){
    $('chips').hidden = all.length === 0;
    chipsT.innerHTML = '';
    [['all','Tudo'],['img','Fotos'],['vid','Vídeos'],['fav','♥ Favoritos']].forEach(function(x){
      chipsT.appendChild(chip(x[1], fType === x[0], function(){ fType = x[0]; applyFilter(); }));
    });
    var cnt = {}, names = [];
    all.forEach(function(it){ var a = it.album; if (!a) return; if (!cnt[a]) { cnt[a] = 0; names.push(a); } cnt[a]++; });
    names.sort(function(a, b){ return cnt[b] - cnt[a]; });
    chipsA.innerHTML = ''; chipsA.hidden = names.length < 2;
    chipsA.appendChild(chip('Todos os álbuns', !fAlbum, function(){ fAlbum = null; applyFilter(); }));
    names.forEach(function(n){
      chipsA.appendChild(chip(n + ' (' + cnt[n] + ')', fAlbum === n, function(){ fAlbum = n; applyFilter(); }));
    });
  }
  function applyFilter(){
    if (fAlbum && !all.some(function(i){ return i.album === fAlbum; })) fAlbum = null;
    items = all.filter(function(it){
      if (fType === 'img' && it.video) return false;
      if (fType === 'vid' && !it.video) return false;
      if (fType === 'fav' && !favs[it.key]) return false;
      if (fAlbum && it.album !== fAlbum) return false;
      return true;
    });
    renderChips(); render();
  }

  /* ---- Datas ---- */
  var MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  var DIAS = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
  function dayLabel(t){
    if (!t) return 'Sem data';
    var d = new Date(t < 1e12 ? t * 1000 : t), n = new Date();
    var d0 = new Date(d.getFullYear(), d.getMonth(), d.getDate()), n0 = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    var diff = Math.round((n0 - d0) / 864e5);
    if (diff <= 0) return 'Hoje';
    if (diff === 1) return 'Ontem';
    if (diff < 7) return DIAS[d.getDay()];
    return MESES[d.getMonth()] + ' de ' + d.getFullYear();
  }

  /* ---- Miniaturas (geradas uma vez e guardadas no aparelho) ---- */
  var db = null;
  function idb(cb){
    if (db) return cb(db);
    try {
      var r = indexedDB.open('meddia-thumbs', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('t'); };
      r.onsuccess = function(){ db = r.result; cb(db); };
      r.onerror = function(){ cb(null); };
    } catch (e) { cb(null); }
  }
  function tget(k, cb){
    idb(function(d){
      if (!d) return cb(null);
      try {
        var q = d.transaction('t').objectStore('t').get(k);
        q.onsuccess = function(){ cb(q.result || null); };
        q.onerror = function(){ cb(null); };
      } catch (e) { cb(null); }
    });
  }
  function tput(k, v){
    idb(function(d){ if (!d) return; try { d.transaction('t', 'readwrite').objectStore('t').put(v, k); } catch (e) {} });
  }
  function toSquare(src, w, h){
    var s = Math.min(w, h), c = document.createElement('canvas');
    c.width = 240; c.height = 240;
    c.getContext('2d').drawImage(src, (w - s) / 2, (h - s) / 2, s, s, 0, 0, 240, 240);
    return c.toDataURL('image/jpeg', 0.7);
  }
  function makeImgThumb(url, cb){
    var im = new Image(), done = false, to = null;
    function end(d){ if (done) return; done = true; clearTimeout(to); im.onload = im.onerror = null; cb(d); }
    to = setTimeout(function(){ end(null); }, 10000);
    im.onerror = function(){ end(null); };
    im.onload = function(){
      try { end(toSquare(im, im.naturalWidth, im.naturalHeight)); } catch (e) { end(null); }
    };
    im.decoding = 'async'; im.src = url;
  }
  function makeVideoThumb(url, cb){
    var v = document.createElement('video'), done = false, to = null;
    v.muted = true; v.preload = 'auto'; v.setAttribute('playsinline', '');
    function end(d){
      if (done) return; done = true; clearTimeout(to);
      v.onerror = v.onloadeddata = v.onseeked = null; v.removeAttribute('src'); v.load(); cb(d);
    }
    to = setTimeout(function(){ end(null); }, 6000);
    v.onerror = function(){ end(null); };
    v.onloadeddata = function(){
      try { v.currentTime = Math.max(0.1, Math.min(1, (v.duration || 2) / 2)); } catch (e) { end(null); }
    };
    v.onseeked = function(){
      try { end(toSquare(v, v.videoWidth || 16, v.videoHeight || 9)); } catch (e) { end(null); }
    };
    v.src = url;
  }
  var tq = [], tbusy = 0, tmem = {};
  function thumb(it, cb){
    if (tmem[it.url]) return cb(tmem[it.url]);
    tq.push({it: it, cb: cb}); tpump();
  }
  function tpump(){
    while (tbusy < 3 && tq.length){
      (function(job){
        tbusy++;
        var k = job.it.url, blob = k.indexOf('blob:') === 0;
        function fin(d){ if (d) tmem[k] = d; job.cb(d); tbusy--; tpump(); }
        function gen(){
          (job.it.video ? makeVideoThumb : makeImgThumb)(k, function(d){ if (d && !blob) tput(k, d); fin(d); });
        }
        if (blob) gen(); else tget(k, function(d){ if (d) fin(d); else gen(); });
      })(tq.shift());
    }
  }

  /* ---- Grade (carrega aos poucos para abrir rápido) ---- */
  var PAGE = 90, shown = 0, lastKey = null, els = [];
  var sentinel = document.createElement('div');
  sentinel.style.cssText = 'grid-column:1/-1;height:1px';
  var io = ('IntersectionObserver' in window)
    ? new IntersectionObserver(function(es){ if (es[0].isIntersecting) addThumbs(); }, {rootMargin: '800px'})
    : null;
  if (io) io.observe(sentinel);

  function makeThumb(i){
    var it = items[i];
    var b = document.createElement('button');
    b.className = 'thumb'; b.setAttribute('aria-label', 'Abrir ' + it.name);
    var t = document.createElement('img'); t.alt = ''; t.decoding = 'async';
    b.appendChild(t);
    thumb(it, function(d){ if (d) t.src = d; else if (!it.video) t.src = it.url; });
    if (it.video){
      var p = document.createElement('span'); p.className = 'play'; p.textContent = '▶'; b.appendChild(p);
    }
    var hb = document.createElement('span'); hb.className = 'hb'; hb.textContent = '♥'; hb.hidden = !favs[it.key];
    b.appendChild(hb); b._hb = hb; els[i] = b;
    b.onclick = function(){ openAt(i); };
    return b;
  }

  function addThumbs(){
    if (sentinel.parentNode) sentinel.parentNode.removeChild(sentinel);
    var frag = document.createDocumentFragment(), end = Math.min(items.length, shown + PAGE);
    for (var i = shown; i < end; i++) {
      var lb = dayLabel(items[i].t);
      if (lb !== lastKey) {
        lastKey = lb;
        var h = document.createElement('div'); h.className = 'dh'; h.textContent = lb; frag.appendChild(h);
      }
      frag.appendChild(makeThumb(i));
    }
    shown = end;
    grid.appendChild(frag);
    if (shown < items.length) grid.appendChild(sentinel);
  }

  function countText(){
    var v = items.filter(function(i){ return i.video; }).length, p = items.length - v, a = [];
    if (p) a.push(p + (p === 1 ? ' foto' : ' fotos'));
    if (v) a.push(v + (v === 1 ? ' vídeo' : ' vídeos'));
    return a.length ? a.join(' · ') : (all.length ? 'Nenhum item' : 'Nenhuma imagem');
  }

  function render(){
    tq.length = 0;
    var n = items.length;
    $('count').textContent = countText();
    empty.hidden = all.length > 0;
    $('none').hidden = !(all.length > 0 && n === 0);
    grid.hidden = n === 0;
    $('clear').hidden = all.length === 0;
    grid.innerHTML = ''; shown = 0; lastKey = null; els = [];
    addThumbs();
  }

  /* ---- Visualizador ---- */
  var vOpen = false;
  function apply(){
    var odd = (Math.abs(rot / 90) % 2) === 1;
    img.style.maxWidth = odd ? stage.clientHeight + 'px' : '100%';
    img.style.maxHeight = odd ? stage.clientWidth + 'px' : '100%';
    img.style.transform = 'translate(' + tx + 'px,' + ty + 'px) rotate(' + rot + 'deg) scale(' + scale + ')';
  }
  function resetView(){ scale = 1; tx = 0; ty = 0; rot = 0; apply(); }
  function stopVideo(){ vid.pause(); vid.removeAttribute('src'); vid.load(); vid.style.display = 'none'; }
  function syncFav(){
    var it = items[cur];
    $('fav').setAttribute('aria-pressed', it && favs[it.key] ? 'true' : 'false');
  }
  function toggleFav(){
    var it = items[cur]; if (!it) return;
    if (favs[it.key]) delete favs[it.key]; else favs[it.key] = 1;
    saveFavs(); syncFav();
    var b = els[cur]; if (b && b._hb) b._hb.hidden = !favs[it.key];
  }
  function show(i){
    cur = (i + items.length) % items.length;
    var it = items[cur];
    viewer.classList.toggle('isvid', !!it.video);
    if (it.video){
      stopShow(); viewer.classList.remove('hide-ui');
      img.removeAttribute('src'); img.style.display = 'none';
      vid.style.display = 'block'; vid.src = it.url;
      var pr = vid.play(); if (pr && pr.catch) pr.catch(function(){});
    } else {
      stopVideo(); img.style.display = 'block';
      img.src = it.url; img.alt = it.name;
    }
    $('title').textContent = it.name;
    $('pos').textContent = (cur + 1) + '/' + items.length;
    syncFav();
    scale = 1; tx = 0; ty = 0; rot = 0; apply();
  }
  function openAt(i){
    viewer.classList.add('open'); viewer.classList.remove('hide-ui'); show(i);
    if (!vOpen) { vOpen = true; try { history.pushState({v: 1}, ''); } catch (e) {} }
  }
  function closeViewer(fromPop){
    stopShow(); stopVideo(); viewer.classList.remove('open'); viewer.classList.remove('isvid');
    if (vOpen) { vOpen = false; if (!fromPop) { try { history.back(); } catch (e) {} } }
  }
  function next(){ if (items.length) show(cur + 1); }
  function prev(){ if (items.length) show(cur - 1); }
  function zoom(f){ scale = Math.min(8, Math.max(1, scale * f)); if (scale === 1){tx = 0; ty = 0;} apply(); }

  function startShow(){ timer = setInterval(next, 3000); $('play').setAttribute('aria-pressed','true'); viewer.classList.add('hide-ui'); }
  function stopShow(){ if (timer){clearInterval(timer); timer = null;} $('play').setAttribute('aria-pressed','false'); }

  $('close').onclick = function(){ closeViewer(false); };
  $('next').onclick = next; $('prev').onclick = prev;
  $('fav').onclick = toggleFav;
  $('zin').onclick = function(){ zoom(1.5); }; $('zout').onclick = function(){ zoom(1/1.5); };
  $('rotl').onclick = function(){ rot -= 90; apply(); };
  $('rotr').onclick = function(){ rot += 90; apply(); };
  $('reset').onclick = resetView;
  $('play').onclick = function(){ timer ? (stopShow(), viewer.classList.remove('hide-ui')) : startShow(); };
  $('remove').onclick = function(){
    stopShow();
    var it = items[cur], ai = all.indexOf(it);
    if (it.url.indexOf('blob:') === 0) URL.revokeObjectURL(it.url);
    if (ai >= 0) all.splice(ai, 1);
    items.splice(cur, 1);
    renderChips(); render();
    if (!items.length) closeViewer(false); else show(Math.min(cur, items.length - 1));
  };

  /* Gestos: arrastar, pinça, toque duplo, deslizar para trocar (só em fotos) */
  var ptrs = {}, startDist = 0, startScale = 1, lastTap = 0, sx = 0, sy = 0, moved = false, lx = 0, ly = 0;
  function count(){ return Object.keys(ptrs).length; }
  function dist(){ var k = Object.keys(ptrs), a = ptrs[k[0]], b = ptrs[k[1]]; return Math.hypot(a.x - b.x, a.y - b.y); }

  stage.addEventListener('pointerdown', function(e){
    if (items[cur] && items[cur].video) return;
    stage.setPointerCapture(e.pointerId);
    ptrs[e.pointerId] = {x: e.clientX, y: e.clientY};
    if (count() === 1){ sx = lx = e.clientX; sy = ly = e.clientY; moved = false; }
    if (count() === 2){ startDist = dist(); startScale = scale; }
  });
  stage.addEventListener('pointermove', function(e){
    if (!ptrs[e.pointerId]) return;
    ptrs[e.pointerId] = {x: e.clientX, y: e.clientY};
    if (count() === 2){
      scale = Math.min(8, Math.max(1, startScale * dist() / startDist)); moved = true; apply();
    } else if (count() === 1){
      if (Math.hypot(e.clientX - sx, e.clientY - sy) > 8) moved = true;
      if (scale > 1){ tx += e.clientX - lx; ty += e.clientY - ly; apply(); }
      lx = e.clientX; ly = e.clientY;
    }
  });
  function end(e){
    if (!ptrs[e.pointerId]) return;
    var was = count();
    delete ptrs[e.pointerId];
    if (was !== 1) return;
    var dx = e.clientX - sx, dy = e.clientY - sy;
    if (scale === 1 && Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      stopShow(); dx < 0 ? next() : prev(); return;
    }
    if (!moved){
      var now = Date.now();
      if (now - lastTap < 300){ scale > 1 ? (scale = 1, tx = 0, ty = 0) : (scale = 2.5); apply(); lastTap = 0; }
      else { lastTap = now; setTimeout(function(){ if (lastTap && Date.now() - lastTap >= 290){ viewer.classList.toggle('hide-ui'); lastTap = 0; } }, 300); }
    }
  }
  stage.addEventListener('pointerup', end);
  stage.addEventListener('pointercancel', end);
  stage.addEventListener('wheel', function(e){ e.preventDefault(); zoom(e.deltaY < 0 ? 1.15 : 1/1.15); }, {passive:false});

  document.addEventListener('keydown', function(e){
    if (!viewer.classList.contains('open')) return;
    var k = e.key;
    if (k === 'Escape') closeViewer(false);
    else if (k === 'ArrowRight') next();
    else if (k === 'ArrowLeft') prev();
    else if (k === '+' || k === '=') zoom(1.25);
    else if (k === '-') zoom(1/1.25);
    else if (k === 'r' || k === 'R') { rot += 90; apply(); }
    else if (k === ' ' && !(items[cur] && items[cur].video)) { e.preventDefault(); timer ? stopShow() : startShow(); }
  });
  window.addEventListener('resize', apply);
  // botão voltar do Android: fecha a foto aberta
  window.addEventListener('popstate', function(){ if (viewer.classList.contains('open')) closeViewer(true); });

  /* ---- Galeria automática (Android) ---- */
  var cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform()) {
    var P = cap.Plugins || {};

    // botão voltar do Android: fecha a foto, depois limpa filtros, depois sai
    if (P.App && P.App.addListener) {
      P.App.addListener('backButton', function(){
        if (viewer.classList.contains('open')) { closeViewer(false); return; }
        if (fType !== 'all' || fAlbum) { fType = 'all'; fAlbum = null; applyFilter(); window.scrollTo(0, 0); return; }
        P.App.exitApp();
      });
    }
    var IMG = /\.(jpe?g|png|gif|webp|bmp|heic|heif|avif)$/i;
    var VID = /\.(mp4|m4v|3gp|3gpp|webm|mov|mkv)$/i;
    var KEY = 'galeria_cache_v2';

    var sig = function(a){
      var v = a.filter(function(i){ return i.video; }).length;
      return a.length + '|' + v + '|' + (a[0] ? a[0].url : '') + '|' + (a.length ? a[a.length - 1].url : '');
    };

    // 1) mostra na hora o que foi encontrado da última vez
    var cached = false;
    try {
      var c = JSON.parse(localStorage.getItem(KEY) || '[]');
      if (c.length) {
        all = c.map(function(x){
          return {url: cap.convertFileSrc(x.u), name: x.n, video: !!x.v, t: x.t, key: x.u, album: x.a};
        });
        applyFilter(); cached = true;
      }
    } catch (e) {}
    if (!cached) $('count').textContent = 'Carregando galeria…';

    // 2) atualiza a lista em segundo plano
    var scan = async function(){
      try {
        try { await P.Media.requestPermissions(); } catch (e) {}
        var res = await P.Media.getAlbums();
        var lists = await Promise.all(res.albums.map(function(a){
          return P.Filesystem.readdir({ path: a.identifier })
            .then(function(r){ return {name: a.name, files: r.files}; })
            .catch(function(){ return {name: a.name, files: []}; });
        }));
        var seen = {}, found = [];
        lists.forEach(function(L){
          L.files.forEach(function(f){
            if (f.type !== 'file' || seen[f.uri]) return;
            var isV = VID.test(f.name);
            if (!isV && !IMG.test(f.name)) return;
            seen[f.uri] = 1;
            var t = f.mtime || 0; if (t && t < 1e12) t *= 1000;
            found.push({url: cap.convertFileSrc(f.uri), name: f.name, video: isV, t: t, key: f.uri, album: L.name});
          });
        });
        found.sort(function(a, b){ return b.t - a.t; });
        try {
          localStorage.setItem(KEY, JSON.stringify(found.map(function(x){
            return {u: x.key, n: x.name, v: x.video ? 1 : 0, t: x.t, a: x.album};
          })));
        } catch (e) {}
        if (sig(found) !== sig(all) && !viewer.classList.contains('open')) { all = found; applyFilter(); }
        if (!all.length) $('count').textContent = 'Nenhuma foto encontrada';
      } catch (e) {
        if (!all.length) $('count').textContent = 'Erro: ' + ((e && (e.message || e.code)) || e);
      }
    };
    scan();
  }
})();
</script>
</body>
</html>
